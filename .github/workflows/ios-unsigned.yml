# Builds an UNSIGNED iOS .ipa on a GitHub Mac, verifies it, and publishes it
# as a Release asset. Sideloadly/AltStore re-sign it with a free Apple ID.
# Trigger: GitHub repo -> Actions -> "iOS unsigned IPA" -> Run workflow.
name: iOS unsigned IPA
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build-ios:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate Xcode project
        run: xcodegen generate
      - name: Build (no code signing)
        run: |
          xcodebuild -project ExpertSnooker.xcodeproj -scheme ExpertSnooker \
            -configuration Release -sdk iphoneos -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" build
      - name: Package unsigned IPA
        run: |
          mkdir -p Payload
          cp -R build/Build/Products/Release-iphoneos/ExpertSnooker.app Payload/
          zip -qry ExpertSnooker_unsigned.ipa Payload
          ls -lh ExpertSnooker_unsigned.ipa
      - name: Verify IPA contents
        run: |
          APP=Payload/ExpertSnooker.app
          echo "== files =="; ls -la "$APP"
          echo "== Info.plist =="; plutil -p "$APP/Info.plist"
          echo "== binary arch =="; lipo -info "$APP/ExpertSnooker"; file "$APP/ExpertSnooker"
          echo "== game.html =="; ls -l "$APP/game.html"; grep -c "maybeScheduleAI" "$APP/game.html"; grep -c "result-win" "$APP/game.html"
          echo "== codesign (expected: unsigned) =="; codesign -dv "$APP" 2>&1 || true
          test -f "$APP/game.html"
          plutil -extract UISupportedInterfaceOrientations json -o - "$APP/Info.plist"
      - name: Publish release with IPA
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "build-${{ github.run_number }}" ExpertSnooker_unsigned.ipa \
            --title "Expert Snooker build ${{ github.run_number }}" \
            --notes "Unsigned IPA for Sideloadly/AltStore. Not yet tested on a physical iPhone." 
      - uses: actions/upload-artifact@v4
        with:
          name: ExpertSnooker_unsigned_ipa
          path: ExpertSnooker_unsigned.ipa
          retention-days: 7
